name: Live evaluation (real models)

# The real engine against real models on real tasks (chat, file access, code review with planted bugs, deep read,
# creating files, APK unpacking). Report: the run's summary page + live-eval.json artifact.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated tasks (empty = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["core/**", "tools/live-eval.mjs"]

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run
        env:
          MYCHAT_KEYS_JSON: ${{ secrets.MYCHAT_KEYS_JSON }}
          MYCHAT_KEYS_BUNDLE: ${{ secrets.MYCHAT_KEYS_BUNDLE }}
          MYCHAT_KEYS_CODE: ${{ secrets.MYCHAT_KEYS_CODE }}
        run: node tools/live-eval.mjs ${{ github.event.inputs.only && format('--only={0}', github.event.inputs.only) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval
          path: live-eval.json
