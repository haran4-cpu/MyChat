name: test
on: [push, pull_request]
jobs:
  privacy:
    # Blocks keys, private data files, personal emails and private project names (names come from the PRIVATE_TERMS
    # secret, never from this public repo).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Privacy guard
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: node tools/privacy-guard.mjs

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests (failures become annotations, readable without signing in)
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee out.txt
          status=${PIPESTATUS[0]}
          grep -E -A12 "^not ok|^# Subtest.*\n?not ok" out.txt | grep -E "not ok|error:|expected|actual|message|at .*test\.mjs" | head -30 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status

  phone-ui:
    # The phone app used like a person uses it (type, send, switch modes, approve, undo) in Chrome at phone size,
    # with the AI providers replaced by a scripted world that fails the way the real ones do (Google 429 JSON, 503s,
    # free channels unreachable at start-up). Screenshots are kept as evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node app/scripts/prepare.mjs
      - name: Scenarios
        shell: bash
        run: |
          mkdir -p shots; st=0
          for s in stale dead max agent; do
            node tools/ui-shot.mjs $s shots/$s 2>&1 | tee shots/$s.log || st=1
            { grep -E "^FAIL|no chrome|Error" shots/$s.log || true; } | while IFS= read -r l; do echo "::error::$s: $l"; done
            echo "::notice::$s: $(tail -1 shots/$s.log)"
          done
          exit $st
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: phone-ui-screenshots, path: shots }

  kestrel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Kestrel tests (Chrome stands in for Edge in the browser checks)
        working-directory: kestrel
        shell: bash
        run: |
          pip install pytest
          set +e
          python -m pytest -q -rf --tb=line tests/test_kestrel.py 2>&1 | tee out.txt
          status=${PIPESTATUS[0]}
          # failures become annotations, readable without signing in
          grep -E "^(FAILED|ERROR)|^/.*:[0-9]+: |Error" out.txt | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status
