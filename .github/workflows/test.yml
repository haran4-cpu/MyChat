name: test
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  phone-ui:
    # The phone app used like a person uses it (type, send, switch modes, approve, undo) in Chrome at phone size,
    # with the AI providers replaced by a scripted world that fails the way the real ones do (Google 429 JSON, 503s,
    # free channels unreachable at start-up). Screenshots are kept as evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node app/scripts/prepare.mjs
      - name: Scenarios
        shell: bash
        run: |
          mkdir -p shots; st=0
          for s in stale dead max agent; do
            node tools/ui-shot.mjs $s shots/$s 2>&1 | tee shots/$s.log || st=1
            grep "^FAIL" shots/$s.log | while IFS= read -r l; do echo "::error::$s: $l"; done
          done
          exit $st
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: phone-ui-screenshots, path: shots }

  kestrel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Kestrel tests (Chrome stands in for Edge in the browser checks)
        working-directory: kestrel
        shell: bash
        run: |
          pip install pytest
          set +e
          python -m pytest -q -rf --tb=line tests/test_kestrel.py 2>&1 | tee out.txt
          status=${PIPESTATUS[0]}
          # failures become annotations, readable without signing in
          grep -E "^(FAILED|ERROR)|^/.*:[0-9]+: |Error" out.txt | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status
