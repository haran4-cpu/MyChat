name: test
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  kestrel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Kestrel tests (Chrome stands in for Edge in the browser checks)
        working-directory: kestrel
        run: |
          pip install pytest
          python -m pytest -q tests/test_kestrel.py
