<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>MyChat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="menuBtn" class="icon" aria-label="Chats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <div class="title"><span id="viewTitle">MyChat</span><span id="viewSub" class="sub"></span></div>
    <button id="newChat" class="icon" aria-label="New chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main id="view-chat" class="view">
    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="statusLine" class="status" hidden></div>
    <div class="composer">
      <div id="modes" class="modes" role="radiogroup" aria-label="Mode"></div>
      <div id="attachRow" class="attachRow" hidden></div>
      <form id="sendForm" class="inputRow">
        <button id="attachBtn" class="attach" type="button" aria-label="Attach files">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg>
        </button>
        <label for="msg" class="sr">Message</label>
        <textarea id="msg" rows="1" dir="auto" placeholder="Message · הודעה"></textarea>
        <button id="sendBtn" class="send" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>
  </main>

  <main id="view-accounts" class="view" hidden></main>
  <main id="view-agent" class="view" hidden></main>
  <main id="view-files" class="view" hidden></main>

  <nav class="tabs">
    <button data-view="chat" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>Chat</button>
    <button data-view="agent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Agent</button>
    <button data-view="files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg>Files</button>
    <button data-view="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Accounts</button>
  </nav>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheetBody">
      <div class="sheetHead"><h2 id="sheetTitle">Checks</h2><button id="sheetClose" class="icon" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <div id="drawer" class="drawer" hidden>
    <div class="drawerBody"><h2>Chats</h2><div id="chatList"></div></div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>
<script>
// Self-test: a stand-in provider so the whole app runs offline (model list + streamed answer).
const sse = (parts) => new Response(new ReadableStream({ start(c) { const e = new TextEncoder();
  for (const p of parts) c.enqueue(e.encode("data: " + JSON.stringify({ choices: [{ delta: { content: p } }] }) + "\n\n"));
  c.enqueue(e.encode("data: [DONE]\n\n")); c.close(); } }), { headers: { "Content-Type": "text/event-stream" } });
const realFetch = window.fetch.bind(window);
window.fetch = async (url, init) => {
  url = String(url);
  if (url.includes("api.groq.com") && url.endsWith("/models")) return new Response(JSON.stringify({ data: [{ id: "openai/gpt-oss-120b" }] }), { headers: { "Content-Type": "application/json" } });
  if (url.includes("api.groq.com") && url.endsWith("/chat/completions")) return sse(["שלום! ", "**MyChat** ", "עובד.", "\n\n```js\nconsole.log(1)\n```"]);
  if (url.startsWith(location.origin)) return realFetch(url, init);
  return new Response("offline in self-test", { status: 503 });
};
localStorage.clear();
localStorage.setItem("mychat.settings", JSON.stringify({ allowKeyless: false }));
</script>
<script type="module" src="main.mjs"></script>
<script type="module">
import { state, setKey } from "./engine.mjs";
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const mark = (k) => document.body.setAttribute("data-step", k);
mark("start");
for (let i = 0; i < 100 && document.querySelector("#viewTitle").textContent !== "Accounts"; i++) await wait(50);
mark("main-ready");
await setKey("groq", "gsk_" + "t".repeat(40));
mark("key-saved");
document.querySelector('.tabs button[data-view="chat"]').click();
document.querySelector("#msg").value = "בדיקה: מה שלומך?";
document.querySelector("#sendForm").requestSubmit();
mark("sent");
for (let i = 0; i < 60 && !document.querySelector(".turnbar, .errcard"); i++) await wait(100);
mark("answered");
await wait(800);
// Agent, Files, attachments and key transfer on the phone's folder (browser storage here, Documents/MyChat on the phone)
let agent = { ok: false };
try {
  const { workspace, importFiles } = await import("./files.mjs");
  const A = await import("./core/agent.mjs");
  const { makeZip } = await import("./core/zip.mjs");
  const fs = await workspace();
  // 1. a ZIP with an APK inside is saved to Inbox/<date> and unpacked into Projects (the APK too)
  const apk = makeZip({ "assets/public/main.mjs": "export const v = 1;\n" });
  const zip = makeZip({ "MyChat.apk": apk, "README.md": "# Demo\n" });
  const imp = await importFiles(fs, [new File([zip], "MyChat-14.zip", { type: "application/zip" })]);
  agent.unzipped = (await fs.read("Projects/MyChat-14/README.md")) === "# Demo\n" && (await fs.read("Projects/MyChat-14/MyChat-apk/assets/public/main.mjs")) === "export const v = 1;\n";
  agent.inbox = imp.saved[0].startsWith("Inbox/");
  // 2. the agent loop: reads inside the archive with a tool, proposes a change, apply + undo
  const replies = [{ tool: "read", args: { path: imp.saved[0] + "!/README.md" } }, { final: "Demo app.", ops: [{ op: "write", path: "notes.md", content: "- milk\n" }] }];
  const seen = [];
  const fake = { chat: async (req) => { seen.push(req.messages.at(-1).content); return { provider: "t", model: "t", content: JSON.stringify(replies.shift()) }; } };
  const r = await A.runAgent(fake, { goal: "what is it?", fs });
  const j = await A.apply(fs, r);
  const applied = (await fs.read("notes.md")) === "- milk\n";
  const u = await A.undo(fs, j);
  agent.ok = applied && u.ok && !(await fs.exists("notes.md")) && /1\| # Demo/.test(seen[1]) && r.answer === "Demo app.";
  agent.kind = fs.kind;
  // 3. key transfer text round-trips with its code
  const K = await import("./core/accounts.mjs");
  const code = K.transferCode();
  agent.keysMove = JSON.stringify(await K.importKeys(await K.exportKeys({ groq: "gsk_x" }, code), code)) === '{"groq":"gsk_x"}';
  // 4. screens render
  document.querySelector('.tabs button[data-view="files"]').click();
  for (let i = 0; i < 40 && !document.querySelector("#view-files .row.file"); i++) await wait(100);
  agent.filesTab = [...document.querySelectorAll("#view-files .row.file")].some((x) => x.textContent.includes("Projects"));
  document.querySelector('.tabs button[data-view="agent"]').click();
  for (let i = 0; i < 40 && !document.querySelector("#view-agent .goal"); i++) await wait(100);
  agent.agentTab = !!document.querySelector("#view-agent .goal");
  agent.attachButton = !!document.querySelector("#attachBtn");
  const { md } = await import("./markdown.mjs");
  const h = md("## T\n\n| a | b |\n|---|---|\n| 1 | 2 |\n\n- x\n- y");
  agent.markdown = /<table>/.test(h) && /<ul><li>x<\/li><li>y<\/li><\/ul>/.test(h) && /<h3/.test(h);
} catch (e) { agent = { ok: false, error: String(e.stack || e) }; }
const saved = JSON.parse(localStorage.getItem("mychat.chats") || "[]");
const vault = localStorage.getItem("mychat.keys.v1") || "";
document.body.setAttribute("data-selftest", JSON.stringify({
  bot: document.querySelector(".msg.bot")?.innerText || "", bold: !!document.querySelector(".msg.bot b"), code: !!document.querySelector(".msg.bot pre code"),
  agent, saved: saved.length, messages: saved[0]?.messages?.length || 0, keyInPlaintext: vault.includes("gsk_"), vaultEncrypted: /^[A-Za-z0-9+/=]+\.[A-Za-z0-9+/=]+$/.test(vault) }));
</script>

</body>
</html>
